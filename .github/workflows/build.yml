# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java 项目构建生成 JAR 包并发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '输入 Release 标签 (如 v1.0.0)'
        required: true
        default: 'v-manual'
      skip_tests:
        description: '是否跳过测试 (true/false)'
        type: boolean
        default: false
      java_version:
        description: '输入 Java 版本 (如 8, 11, 17)'
        required: true
        default: '8'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ github.event.inputs.java_version || '8' }}  # 使用输入的 Java 版本，默认为 8
          distribution: 'temurin'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 使用 Maven 构建并生成 JAR
        run: |
          echo "mvn clean package -B ${{ inputs.skip_tests == 'true' && '-DskipTests' || '' }}"
          mvn clean package -B ${{ inputs.skip_tests == 'true' && '-DskipTests' || '' }}
          echo "Maven 构建完成"

      - name: 上传 JAR 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
