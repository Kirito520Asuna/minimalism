# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java 项目构建生成 JAR 包并发布

on:
  push:
    tags:  # 触发条件1：推送 v* 标签时（如 v1.0.0）
      - 'v*'
  workflow_dispatch:  # 触发条件2：手动触发
    inputs:
      tag_name:  # 用户手动输入的 Release 标签
        description: '输入 Release 标签 (如 v1.0.0)'
        required: true
        default: 'v-manual'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 使用 Maven 构建并生成 JAR
        run: mvn clean package -B  # 生成 target/*.jar

      - name: 上传 JAR 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar  # 上传所有 JAR 文件
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}  # 使用手动输入的标签或推送的标签
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}  # Release 标题
          draft: false  # 非草稿，直接发布
          prerelease: false  # 非预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 使用 GitHub Token 认证
